<script>
/* Utilidades gerais: texto, datas, markdown e leitura das observações. */
const U = (() => {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const tokens = s => norm(s).replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
  const uid = p => p + '-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);

  // Datas sempre no fuso de Brasília.
  const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
  const nowISO = () => new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Sao_Paulo', dateStyle: 'short', timeStyle: 'medium' }).format(new Date()).replace(' ', 'T');
  const fmtDate = iso => iso ? iso.slice(0, 10).split('-').reverse().join('/') : '';
  const days = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
  const age = iso => {
    if (!iso) return null;
    const [y, m, d] = iso.split('-').map(Number), [ty, tm, td] = today().split('-').map(Number);
    return ty - y - ((tm < m || (tm === m && td < d)) ? 1 : 0);
  };
  const parseDateBR = s => { const m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null; };
  const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  // Cor estável por valor (etiquetas).
  const FIXAS = { 'APROVADO': 140, 'ACOMPANHAR': 42, 'DESCARTAR': 2, 'VIDEO': 215, 'IN LOCO': 280, 'PROFISSIONAL': 205 };
  const hue = s => { if (s in FIXAS) return FIXAS[s]; let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

  // Markdown simples (o suficiente para as observações e o Norteador).
  const inline = s => esc(s)
    .replace(/&lt;br&gt;/g, '<br>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])_([^_\n]+?)_(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');

    const flushL = () => { if (list) { out.push(`<${list.t}>` + list.items.map(i => `<li>${i}</li>`).join('') + `</${list.t}>`); list = null; } };
    const flushT = () => {
      if (!table) return;
      const rows = table.filter(r => !/^\|[\s:|-]+\|?$/.test(r)).map(r => r.replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim())));
      out.push('<div class="tbl-wrap"><table class="md-tbl"><thead><tr>' + rows[0].map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>' +
        rows.slice(1).map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
      table = null;
    };
    for (const raw of String(text).split('\n')) {
      const l = raw.trimEnd(), t = l.trim();
      if (t.startsWith('|')) { flushP(); flushL(); (table = table || []).push(t); continue; }
      flushT();
      let m;
      if (!t) { flushP(); flushL(); }
      else if ((m = t.match(/^(#{1,3})\s+(.*)$/))) { flushP(); flushL(); out.push(`<h${m[1].length + 1}>${inline(m[2])}</h${m[1].length + 1}>`); }
      else if (/^(---+|⸻)$/.test(t)) { flushP(); flushL(); out.push('<hr>'); }
      else if ((m = t.match(/^[-•]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(inline(m[1])); }
      else if ((m = t.match(/^\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(inline(m[1])); }
      else { flushL(); para.push(inline(t)); }
    }

  };

  /* Lê uma observação de partida e devolve os jogadores citados:
     "4 – Nome: texto", "**4 - Nome** – texto" ou "**4 – Nome**" seguido do texto na linha de baixo. */
  const parseEntries = text => {
    const out = []; let club = null, cur = null;
    for (const raw of String(text || '').split('\n')) {
      const line = raw.trim();
      const m = line.match(/^(\*\*)?\s*(\d{1,2})\s*[–—-]\s*(.+)$/);
      if (m) {
        const rest = m[3]; let name, txt = '';
        const b = rest.indexOf('**');
        if (m[1] && b > 0) { name = rest.slice(0, b); txt = rest.slice(b + 2); }
        else { const k = rest.search(/:|\s[–—-]\s/); if (k > 0) { name = rest.slice(0, k); txt = rest.slice(k); } else name = rest; }
        name = name.replace(/\*\*/g, '').replace(/[:\s]+$/, '').trim();
        txt = txt.replace(/\*\*/g, '').replace(/^[\s:–—-]+/, '').trim();
        if (name.length >= 2 && name.length <= 45 && name.split(/\s+/).length <= 6 && !/\d\s*[xX]\s*\d/.test(name) && !/[.!?]/.test(name.replace(/\b\w\./g, ''))) {
          cur = { num: +m[2], nome: name, clube: club, texto: txt }; out.push(cur); continue;
        }
      }
      if (!line) continue;
      if (/^(---+|⸻)$/.test(line)) { cur = null; continue; }
      const plain = line.replace(/\*\*/g, '').trim();
      const header = plain.length <= 40 && plain.split(/\s+/).length <= 5 && !/[.:,;!?–—]|\d\s*[xX]\s*\d|\d\/\d/.test(plain);
      if (header && (line.startsWith('**') || !cur || cur.texto)) { club = plain; cur = null; continue; }
      if (cur) cur.texto += (cur.texto ? '\n' : '') + plain;
    }
    return out;
  };

  /* Cabeçalho de um relatório colado: "CLUBE A 2 x 1 CLUBE B – COMPETIÇÃO – RODADA – 28/10/2024 – ESTÁDIO". */
  const parseHeader = text => {
    const lines = String(text || '').split('\n').map(l => l.replace(/\*\*/g, '').trim()).filter(Boolean);
    const first = lines.slice(0, 4).join(' – ');
    const m = (lines[0] || '').match(/^(.+?)\s+(\d+)\s*[xX]\s*(\d+)\s+(.+?)(?:\s+[–—-]\s+(.*))?$/);
    const r = { data: parseDateBR(first) };
    if (!m) return r;
    r.mandante = m[1].trim(); r.placar = `${m[2]}X${m[3]}`; r.adversario = m[4].trim();
    const resto = [m[5], ...lines.slice(1, 4)].filter(Boolean).join(' – ').split(/\s+[–—-]\s+/).map(s => s.trim()).filter(Boolean);
    const semData = resto.filter(p => !/\d{1,2}\/\d{1,2}\/\d{4}/.test(p) && !/^rodada\b/i.test(p));
    r.competicao = semData[0] || null;
    const iData = resto.findIndex(p => /\d{1,2}\/\d{1,2}\/\d{4}/.test(p));
    if (iData >= 0 && resto[iData + 1]) r.local = resto[iData + 1];
    return r;
  };

  const csv = (rows, cols) => [cols.map(c => c.label), ...rows.map(r => cols.map(c => c.get(r)))]
    .map(l => l.map(v => { const s = Array.isArray(v) ? v.join('; ') : String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  const download = (name, text, type = 'text/plain') => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  return { esc, norm, tokens, uid, today, nowISO, fmtDate, days, age, parseDateBR, MESES, debounce, hue, chip, md, parseEntries, parseHeader, csv, download };
})();

<script>
/* Armazenamento: os dados ficam em arquivos JSON num repositório privado do GitHub.
   Cada salvamento vira um commit (histórico completo). Uma cópia fica no navegador para abrir rápido. */
const Store = (() => {
  const ARQ = { jogadores: 'jogadores.json', clubes: 'clubes.json', partidas: 'partidas.json', contatos: 'contatos.json', campogramas: 'campogramas.json' };
  const DB = { jogadores: [], clubes: [], partidas: [], contatos: [], campogramas: [], config: { lembretes: { APROVADO: 30, ACOMPANHAR: 45 }, opcoes: {} }, norteador: '', obs: {} };
  const obsAno = {};           // partidaId -> arquivo de observações onde está hoje
  const shas = {};             // arquivo -> sha no GitHub
  const dirty = new Set();
  const mudados = {}, apagados = {};   // arquivo -> ids alterados/apagados aqui desde o último salvamento (para juntar com outro aparelho)
  let backend = null, cache = {}, status = 'ok', listeners = [], flushing = false, timer = null, lastError = '';

  /* ---------- backends ---------- */
  const b64 = text => { const by = new TextEncoder().encode(text); let s = ''; for (let i = 0; i < by.length; i += 0x8000) s += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(s); };
  const GitHub = cfg => {
    const base = `${cfg.api || 'https://api.github.com'}/repos/${encodeURIComponent(cfg.user)}/${encodeURIComponent(cfg.repo)}/contents/`;
    const hd = extra => ({ Authorization: 'Bearer ' + cfg.token, 'X-GitHub-Api-Version': '2022-11-28', ...extra });
    const fail = async r => { let m = ''; try { m = (await r.json()).message; } catch { } const e = new Error(`GitHub ${r.status}${m ? ': ' + m : ''}`); e.status = r.status; throw e; };
    return {
      nome: `${cfg.user}/${cfg.repo}`, remoto: true,
      async list() { const r = await fetch(base, { headers: hd({ Accept: 'application/vnd.github+json' }), cache: 'no-store' }); if (r.status === 404) { const m = ((await r.clone().json().catch(() => ({}))).message || ''); if (/empty/i.test(m)) return {}; } if (!r.ok) await fail(r); const o = {}; for (const f of await r.json()) if (f.type === 'file') o[f.name] = f.sha; return o; },
      async read(name) { const r = await fetch(base + encodeURIComponent(name), { headers: hd({ Accept: 'application/vnd.github.raw+json' }), cache: 'no-store' }); if (!r.ok) await fail(r); return r.text(); },
      async write(name, text, sha, msg) {
        const r = await fetch(base + encodeURIComponent(name), { method: 'PUT', headers: hd({ Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }), body: JSON.stringify({ message: msg, content: b64(text), ...(sha ? { sha } : {}) }) });
        if (!r.ok) await fail(r); return (await r.json()).content.sha;
      },
    };
  };
  const Pacote = arquivos => ({   // modo de teste com um arquivo de pacote: nada é salvo
    nome: 'modo de teste (nada é salvo)', remoto: false,
    async list() { return Object.fromEntries(Object.keys(arquivos).map(n => [n, 'p'])); },
    async read(name) { return arquivos[name]; },
    async write() { return 'p-' + Date.now(); },
  });
  const Local = base => ({   // modo de teste: lê de uma pasta, não grava em lugar nenhum
    nome: 'modo de teste (nada é salvo)', remoto: false,
    async list() { return (await (await fetch(base + 'index.json', { cache: 'no-store' })).json()); },
    async read(name) { const r = await fetch(base + name, { cache: 'no-store' }); if (!r.ok) throw new Error('Arquivo não encontrado: ' + name); return r.text(); },
    async write(name, text) { return 'local-' + Date.now(); },
  });

  /* ---------- cópia local (IndexedDB) ---------- */
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open('scout-cache', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const cacheGetAll = async () => { try { const db = await idb(); return await new Promise(res => { const o = {}; const c = db.transaction('f').objectStore('f').openCursor(); c.onsuccess = () => { const k = c.result; if (k) { o[k.key] = k.value; k.continue(); } else res(o); }; c.onerror = () => res({}); }); } catch { return {}; } };
  const cachePut = async (name, v) => { try { const db = await idb(); db.transaction('f', 'readwrite').objectStore('f').put(v, name); } catch { } };
  const cacheClear = async () => { try { const db = await idb(); db.transaction('f', 'readwrite').objectStore('f').clear(); } catch { } };

  /* ---------- carregar ---------- */
  const apply = (name, text) => {
    const ent = Object.keys(ARQ).find(k => ARQ[k] === name);
    if (ent) DB[ent] = JSON.parse(text || '[]');
    else if (name === 'config.json') { const c = JSON.parse(text || '{}'); DB.config = { lembretes: { APROVADO: 30, ACOMPANHAR: 45 }, opcoes: {}, ...c }; }
    else if (name === 'norteador.md') DB.norteador = text;
    else if (/^observacoes-.+\.json$/.test(name)) {
      for (const id of Object.keys(obsAno)) if (obsAno[id] === name) { delete obsAno[id]; delete DB.obs[id]; }
      const o = JSON.parse(text || '{}'); for (const id in o) { DB.obs[id] = o[id]; obsAno[id] = name; }
    }
  };
  const wanted = n => Object.values(ARQ).includes(n) || n === 'config.json' || n === 'norteador.md' || /^observacoes-.+\.json$/.test(n);
  async function load(onProgress = () => { }) {
    const remote = await backend.list();
    const names = Object.keys(remote).filter(wanted);
    if (backend.remoto) cache = await cacheGetAll();
    let done = 0;
    await Promise.all(names.map(async n => {
      let text;

      else { text = await backend.read(n); if (backend.remoto) cachePut(n, { sha: remote[n], text }); }

  }
  async function connect(cfg, onProgress) {
    backend = cfg.pacote ? Pacote(cfg.pacote) : cfg.local ? Local(cfg.local) : GitHub(cfg);

  async function refresh() {
    if (!backend || !backend.remoto || dirty.size || flushing) return false;
    try {
      const remote = await backend.list(); let changed = false;
      for (const n of Object.keys(remote).filter(wanted)) if (shas[n] !== remote[n]) {
        const text = await backend.read(n); shas[n] = remote[n]; apply(n, text); cachePut(n, { sha: remote[n], text }); changed = true;
      }
      if (changed) invalidate();
      return changed;
    } catch { return false; }
  }

  /* Envia um pacote (arquivo scout-dados.json) para um repositório vazio, arquivo por arquivo. */
  async function enviarPacote(cfg, arquivos, onProgress = () => { }) {
    const gh = GitHub(cfg), existentes = await gh.list(), nomes = Object.keys(arquivos);
    let i = 0;
    for (const n of nomes) { await gh.write(n, arquivos[n], existentes[n], 'Importa ' + n + ' (migração do Coda)'); onProgress(++i, nomes.length); }
  }
  const lerPacote = text => {
    const o = JSON.parse(text);
    if (!o || o.formato !== 'scout-dados' || !o.arquivos) throw new Error('Este arquivo não é um pacote de dados do Scouting.');
    return o.arquivos;
  };
  const arquivosVazios = remote => !Object.keys(remote).some(wanted);

  /* ---------- salvar ---------- */
  const lines = arr => '[\n' + arr.map(x => JSON.stringify(x)).join(',\n') + '\n]\n';
  const serialize = name => {
    const ent = Object.keys(ARQ).find(k => ARQ[k] === name);
    if (ent) return lines(DB[ent]);
    if (name === 'config.json') return JSON.stringify(DB.config, null, 1) + '\n';
    if (name === 'norteador.md') return DB.norteador;
    const ids = Object.keys(obsAno).filter(id => obsAno[id] === name && DB.obs[id]);
    return '{\n' + ids.map(id => JSON.stringify(id) + ':' + JSON.stringify(DB.obs[id])).join(',\n') + '\n}\n';
  };
  const emit = () => listeners.forEach(f => f(status, lastError));
  const setStatus = (s, err = '') => { status = s; lastError = err; emit(); };
  function mark(name, id, apagado) { dirty.add(name); if (id) (apagado ? (apagados[name] = apagados[name] || new Set()) : (mudados[name] = mudados[name] || new Set())).add(id); invalidate(); setStatus('pendente'); clearTimeout(timer); timer = setTimeout(flush, 1200); }
  async function flush() {
    if (flushing || !dirty.size) return;
    flushing = true; setStatus('salvando');
    try {
      while (dirty.size) {
        const name = dirty.values().next().value; dirty.delete(name);
        const text = serialize(name);
        try {
          let sha;
          try { sha = await backend.write(name, text, shas[name], 'Atualiza ' + name); }
          catch (e) {
            if (e.status !== 409 && e.status !== 422) throw e;

            if (outro != null) juntar(name, outro);
            sha = await backend.write(name, serialize(name), remote[name], 'Atualiza ' + name);
          }
          delete mudados[name]; delete apagados[name];
          shas[name] = sha; if (backend.remoto) cachePut(name, { sha, text });

    finally { flushing = false; }
  }

  function juntar(name, textoRemoto) {
    const m = mudados[name] || new Set(), a = apagados[name] || new Set();
    const ent = Object.keys(ARQ).find(k => ARQ[k] === name);
    if (ent) {
      const local = new Map(DB[ent].map(r => [r.id, r])), rem = JSON.parse(textoRemoto || '[]');
      const out = rem.filter(r => !a.has(r.id)).map(r => m.has(r.id) && local.has(r.id) ? local.get(r.id) : r);
      const ja = new Set(out.map(r => r.id)); const novos = DB[ent].filter(r => m.has(r.id) && !ja.has(r.id));
      DB[ent] = [...novos, ...out];
    } else if (/^observacoes-/.test(name)) {
      const rem = JSON.parse(textoRemoto || '{}');
      for (const id of Object.keys(obsAno)) if (obsAno[id] === name && !m.has(id)) { delete obsAno[id]; delete DB.obs[id]; }
      for (const id in rem) if (!m.has(id) && !a.has(id)) { DB.obs[id] = rem[id]; obsAno[id] = name; }

  }

  /* ---------- operações de dados ---------- */
  const idx = {};
  function invalidate() { for (const k in idx) delete idx[k]; }
  const memo = (k, fn) => (k in idx ? idx[k] : (idx[k] = fn()));
  const byId = ent => memo('id:' + ent, () => new Map(DB[ent].map(r => [r.id, r])));
  const get = (ent, id) => byId(ent).get(id);
  const PREF = { jogadores: 'j', clubes: 'c', partidas: 'p', contatos: 'k', campogramas: 'g' };
  function add(ent, rec) { const r = { id: U.uid(PREF[ent]), criado: U.nowISO(), modificado: U.nowISO() }; for (const k in rec) if (rec[k] != null && rec[k] !== '') r[k] = rec[k]; DB[ent].unshift(r); mark(ARQ[ent], r.id); return r; }

  }

    DB[ent] = DB[ent].filter(r => r.id !== id); mark(ARQ[ent], id, true);
    const strip = (e, f, multi) => { let ch = false; for (const r of DB[e]) { if (multi && r[f] && r[f].includes(id)) { r[f] = r[f].filter(x => x !== id); if (!r[f].length) delete r[f]; ch = true; } if (!multi && r[f] === id) { delete r[f]; ch = true; } if (ch) { mark(ARQ[e], r.id); ch = false; } } };
    if (ent === 'jogadores') { strip('partidas', 'jogadores', true); strip('contatos', 'jogadores', true); for (const g of DB.campogramas) for (const k in (g.slots || {})) if (g.slots[k].includes(id)) { g.slots[k] = g.slots[k].filter(x => x !== id); mark(ARQ.campogramas, g.id); } }
    if (ent === 'clubes') { strip('jogadores', 'clubes', true); strip('partidas', 'mandante'); strip('partidas', 'adversario'); }
    if (ent === 'partidas') setObs(id, '');
  }
  function setObs(id, text) {
    const p = get('partidas', id); const alvo = `observacoes-${p && p.data ? p.data.slice(0, 4) : 'sem-data'}.json`;
    const atual = obsAno[id];
    if (!text) { if (atual) { delete DB.obs[id]; delete obsAno[id]; mark(atual, id, true); } return; }
    DB.obs[id] = text; obsAno[id] = alvo; mark(alvo, id); if (atual && atual !== alvo) mark(atual, id, true);
  }
  const reObs = id => { if (DB.obs[id]) setObs(id, DB.obs[id]); };   // depois de mudar a data: move a observação para o arquivo do ano certo
  // Pacote com todos os arquivos atuais (cópia de segurança que também serve para restaurar).
  function pacote() {
    const nomes = new Set([...Object.values(ARQ), 'config.json', 'norteador.md', ...Object.values(obsAno), ...Object.keys(shas).filter(wanted)]);
    return { formato: 'scout-dados', versao: 1, gerado: U.nowISO(), arquivos: Object.fromEntries([...nomes].sort().map(n => [n, serialize(n)])) };
  }
  function setConfig(patch) { Object.assign(DB.config, patch); mark('config.json'); }
  function setNorteador(text) { DB.norteador = text; mark('norteador.md'); }

  return {
    DB, ARQ, connect, refresh, enviarPacote, lerPacote, pacote, listar: async cfg => GitHub(cfg).list(), arquivosVazios, flush, mark, get, byId, add, set, remove, setObs, reObs, setConfig, setNorteador, memo, cacheClear,
    onStatus: f => listeners.push(f), get status() { return status; }, get pendente() { return dirty.size > 0 || flushing; },
    get backend() { return backend; },
  };
})();

<script>
/* Regras do banco: campos, relações e tudo que é calculado (as "fórmulas" do Coda). */
const M = (() => {
  const { DB, memo, get } = Store;

  /* Definição dos campos de cada tabela. t: text | date | sel | multi | rel | rels | md | url */
  const CAMPOS = {
    jogadores: [
      { k: 'nome', l: 'Nome', t: 'text' }, { k: 'nomeCompleto', l: 'Nome completo', t: 'text' },
      { k: 'posicoes', l: 'Posição', t: 'multi' }, { k: 'perfil', l: 'Perfil da posição', t: 'sel' },
      { k: 'nascimento', l: 'Data de nascimento', t: 'date' }, { k: 'pe', l: 'Pé dominante', t: 'sel' },
      { k: 'biotipo', l: 'Biotipo', t: 'sel' }, { k: 'altura', l: 'Altura', t: 'sel' },
      { k: 'alturaCm', l: 'Altura (cm)', t: 'text' }, { k: 'pesoKg', l: 'Peso (kg)', t: 'text' }, { k: 'contrato', l: 'Contrato até', t: 'text' }, { k: 'ogol', l: 'Link oGol', t: 'url' },
      { k: 'clubes', l: 'Clube atual', t: 'rels', ent: 'clubes' }, { k: 'categorias', l: 'Categoria', t: 'multi' },
      { k: 'nacionalidade', l: 'Nacionalidade', t: 'sel' }, { k: 'status', l: 'Status', t: 'sel' },
      { k: 'potencial', l: 'Potencial do jogador', t: 'sel' }, { k: 'fortes', l: 'Pontos fortes', t: 'multi' },
      { k: 'fracos', l: 'Pontos fracos', t: 'multi' }, { k: 'video', l: 'Link vídeo', t: 'url' },
      { k: 'report', l: 'Report do atleta', t: 'md' },
    ],
    partidas: [
      { k: 'data', l: 'Data da partida', t: 'date' }, { k: 'competicao', l: 'Competição', t: 'sel' }, { k: 'rodada', l: 'Rodada / fase', t: 'text' },
      { k: 'mandante', l: 'Clube', t: 'rel', ent: 'clubes', txt: 'mandanteNome' }, { k: 'placar', l: 'Placar', t: 'text' },
      { k: 'adversario', l: 'Adversário', t: 'rel', ent: 'clubes', txt: 'adversarioNome' }, { k: 'local', l: 'Local da partida', t: 'sel' },
      { k: 'categoria', l: 'Categoria', t: 'sel' }, { k: 'formato', l: 'Formato da observação', t: 'sel' },
      { k: 'video', l: 'Vídeo partida', t: 'url' }, { k: 'jogadores', l: 'Jogadores em campo', t: 'rels', ent: 'jogadores' },
    ],
    clubes: [
      { k: 'nome', l: 'Nome do clube', t: 'text' }, { k: 'pais', l: 'País', t: 'sel' }, { k: 'categorias', l: 'Categoria', t: 'multi' },
      { k: 'competicao', l: 'Competições', t: 'sel' }, { k: 'tipo', l: 'Tipo de equipe', t: 'sel' }, { k: 'obs', l: 'Observações', t: 'md' },
    ],
    contatos: [
      { k: 'nome', l: 'Nome', t: 'text' }, { k: 'organizacoes', l: 'Organização', t: 'multi' }, { k: 'cargo', l: 'Cargo / posição', t: 'sel' },
      { k: 'pais', l: 'País', t: 'sel' }, { k: 'contato', l: 'Contato', t: 'md', curto: true },
      { k: 'ultimoContato', l: 'Último contato', t: 'date' }, { k: 'proximoContato', l: 'Próximo follow-up', t: 'date' },
      { k: 'jogadores', l: 'Jogadores representados', t: 'rels', ent: 'jogadores' }, { k: 'notas', l: 'Notas', t: 'md' },
    ],
  };
  const BASE = {   // opções que existem mesmo sem uso ainda
    'jogadores.status': ['ACOMPANHAR', 'APROVADO', 'DESCARTAR'], 'jogadores.pe': ['DIREITO', 'ESQUERDO', 'AMBIDESTRO'],
    'jogadores.biotipo': ['BOM', 'NORMAL', 'RUIM'], 'jogadores.altura': ['ALTO', 'NORMAL', 'BAIXO'], 'jogadores.potencial': ['A', 'B', 'C', 'D'],
    'jogadores.posicoes': ['GOLEIRO', 'ZAGUEIRO', 'LATERAL DIREITO', 'LATERAL ESQUERDO', 'VOLANTE', 'MÉDIO', 'MEIA', 'EXTREMO', 'ATACANTE'],
    'partidas.formato': ['VIDEO', 'IN LOCO'], 'clubes.tipo': ['CLUBE', 'SELEÇÃO', 'PROJETO/ACADEMIA'],
    'contatos.cargo': ['AGENTE', 'DONO', 'DIRETOR', 'SCOUT'],
  };
  const CATS = ['PROFISSIONAL', 'EQUIPE B', 'U20', 'U19', 'U18', 'U17', 'U16', 'U15'];
  const opcoes = (ent, k) => memo(`op:${ent}.${k}`, () => {
    const cont = new Map();
    for (const r of DB[ent]) for (const v of [].concat(r[k] ?? [])) cont.set(v, (cont.get(v) || 0) + 1);
    let base = BASE[`${ent}.${k}`] || [];
    if (k === 'categorias' || k === 'categoria') base = CATS;
    if (k === 'pais' || k === 'nacionalidade') for (const e of ['clubes', 'contatos']) for (const r of DB[e]) if (r.pais && !cont.has(r.pais)) cont.set(r.pais, 0);
    for (const v of [...base, ...((DB.config.opcoes || {})[`${ent}.${k}`] || [])]) if (!cont.has(v)) cont.set(v, 0);
    const ordemBase = new Map(base.map((v, i) => [v, i]));
    return [...cont.keys()].sort((a, b) => (ordemBase.has(a) && ordemBase.has(b)) ? ordemBase.get(a) - ordemBase.get(b) : ordemBase.has(a) ? -1 : ordemBase.has(b) ? 1 : String(a).localeCompare(String(b), 'pt'));
  });

  /* ---------- nomes e relações ---------- */
  const nomeClube = id => (get('clubes', id) || {}).nome || '';
  const nomeJog = id => (get('jogadores', id) || {}).nome || '';
  const clubesDe = j => (j.clubes || []).map(nomeClube).filter(Boolean);
  // TÍTULO DO JOGO: "CLUBE PLACAR ADVERSÁRIO – COMPETIÇÃO – LOCAL"
  // Clube da partida: o registro ligado ou, se no Coda estava só escrito, o texto.
  const nomeLado = (p, k) => nomeClube(p[k]) || p[k + 'Nome'] || '';
  const titulo = p => [[nomeLado(p, 'mandante'), p.placar, nomeLado(p, 'adversario')].filter(Boolean).join(' '), p.competicao, p.local].filter(Boolean).join(' – ') || '(partida sem título)';
  const tituloCurto = p => [nomeLado(p, 'mandante'), p.placar, nomeLado(p, 'adversario')].filter(Boolean).join(' ') || '(sem clubes)';
  const rotulo = (ent, r) => !r ? '' : ent === 'partidas' ? titulo(r) : r.nome || (r.organizacoes || [])[0] || '(sem nome)';

  /* Clubes que nas partidas estão só como texto (sem ligação com a tabela de Clubes). */
  const IGUAIS = { ecuador: 'equador', paraguay: 'paraguai', uruguay: 'uruguai', brazil: 'brasil', at: 'atletico', atl: 'atletico', dep: 'deportivo', ind: 'independiente', sub: 'u', fc: '', cd: '', club: '', clube: '', de: '', futbol: '', futebol: '', sc: '', ec: '' };
  const chave = s => U.tokens(s).map(t => t in IGUAIS ? IGUAIS[t] : t).filter(Boolean);
  const clubesSoltos = () => memo('soltos', () => {
    const m = new Map();
    for (const p of DB.partidas) for (const k of ['mandanteNome', 'adversarioNome']) if (p[k]) m.set(p[k], (m.get(p[k]) || 0) + 1);
    return [...m].map(([nome, n]) => ({ nome, n })).sort((a, b) => b.n - a.n || a.nome.localeCompare(b.nome, 'pt'));
  });
  const sugerirClubes = nome => {
    const a = chave(nome); if (!a.length) return [];
    const base = memo('chaves', () => DB.clubes.map(c => ({ c, t: chave(c.nome) })));
    return base.map(({ c, t }) => { const comuns = a.filter(x => t.includes(x)).length; return { c, s: comuns / Math.max(a.length, t.length), comuns }; })
      .filter(x => x.comuns && x.s >= 0.5).sort((x, y) => y.s - x.s).slice(0, 3);
  };

  const partidasPorJogador = () => memo('pj', () => {
    const m = new Map();
    for (const p of DB.partidas) for (const id of p.jogadores || []) { if (!m.has(id)) m.set(id, []); m.get(id).push(p); }
    for (const l of m.values()) l.sort((a, b) => (b.data || '').localeCompare(a.data || ''));
    return m;
  });
  const partidasDe = jid => partidasPorJogador().get(jid) || [];
  const partidasDoClube = cid => memo('pc:' + cid, () => DB.partidas.filter(p => p.mandante === cid || p.adversario === cid).sort((a, b) => (b.data || '').localeCompare(a.data || '')));
  const jogadoresDoClube = cid => memo('jc:' + cid, () => DB.jogadores.filter(j => (j.clubes || []).includes(cid)));  // corrige a fórmula do Coda: vale também para quem tem clube + seleção
  const agentesDe = jid => memo('ag:' + jid, () => DB.contatos.filter(c => (c.jogadores || []).includes(jid)));
  const ultimaVez = jid => { const l = partidasDe(jid); return l.length ? l[0].data || null : null; };
  const diasSemVer = jid => { const d = ultimaVez(jid); return d ? U.days(d, U.today()) : null; };

  /* ---------- fichas incompletas ---------- */
  const ESSENCIAIS = [['posicoes', 'posição'], ['nascimento', 'nascimento'], ['pe', 'pé'], ['clubes', 'clube'], ['nacionalidade', 'nacionalidade'], ['status', 'status']];
  const faltando = j => ESSENCIAIS.filter(([k]) => j[k] == null || (Array.isArray(j[k]) && !j[k].length)).map(([, l]) => l);

  /* ---------- lembretes ---------- */
  const paraRever = () => memo('rever', () => {
    const lim = DB.config.lembretes || {};
    return DB.jogadores.filter(j => lim[j.status] != null).map(j => ({ j, dias: diasSemVer(j.id), limite: lim[j.status] }))
      .filter(x => x.dias == null || x.dias > x.limite).sort((a, b) => (b.dias ?? 1e9) - (a.dias ?? 1e9));
  });
  const followUps = () => memo('fu', () => { const lim = U.today(); const mais7 = new Date(Date.parse(lim) + 7 * 864e5).toISOString().slice(0, 10); return DB.contatos.filter(c => c.proximoContato && c.proximoContato <= mais7).sort((a, b) => a.proximoContato.localeCompare(b.proximoContato)); });

  /* ---------- jogadores citados nas observações ---------- */
  const entradas = pid => memo('en:' + pid, () => U.parseEntries(DB.obs[pid]));
  const indiceNomes = () => memo('in', () => {
    const exato = new Map(), porToken = new Map(), info = new Map();
    const put = (m, k, j) => { if (!k) return; if (!m.has(k)) m.set(k, []); if (!m.get(k).includes(j)) m.get(k).push(j); };
    for (const j of DB.jogadores) {
      put(exato, U.tokens(j.nome).join(' '), j); if (j.nomeCompleto) put(exato, U.tokens(j.nomeCompleto).join(' '), j);
      const tk = [...U.tokens(j.nome), ...U.tokens(j.nomeCompleto || '')]; info.set(j.id, { tk: new Set(tk), tn: U.tokens(j.nome) });
      for (const t of new Set(tk)) put(porToken, t, j);
    }
    return { exato, porToken, info };
  });
  /* Procura o jogador citado. Devolve [{j, grau}] — grau 'certo' (nome igual) ou 'provavel'. */
  const acharJogador = (nome, partida, clubeTexto) => {
    const { exato, porToken, info } = indiceNomes(); const tk = U.tokens(nome); if (!tk.length) return [];
    const doJogo = j => partida && (j.clubes || []).some(c => c === partida.mandante || c === partida.adversario);
    const doClubeCitado = j => clubeTexto && clubesDe(j).some(n => U.norm(n) === U.norm(clubeTexto));
    let cands = (exato.get(tk.join(' ')) || []).map(j => ({ j, grau: 'certo' }));
    if (!cands.length && tk.length >= 2) {
      const ult = tk[tk.length - 1], vistos = new Set();
      for (const j of porToken.get(ult) || []) {
        if (vistos.has(j)) continue; vistos.add(j);
        const i = info.get(j.id);
        const todosNoJog = tk.every(t => i.tk.has(t) || (t.length === 1 && [...i.tk].some(x => x[0] === t)));
        const jogNoTexto = i.tn.length >= 2 && i.tn.every(t => tk.includes(t));
        if (todosNoJog || jogNoTexto) cands.push({ j, grau: 'provavel' });
      }
    }
    if (cands.length > 1) { const f = cands.filter(c => doJogo(c.j) || doClubeCitado(c.j)); if (f.length) cands = f; }
    return cands.slice(0, 4);
  };
  /* Para uma partida: cada citado com sua situação. */
  const citados = pid => memo('ci:' + pid, () => {
    const p = get('partidas', pid); if (!p) return [];
    const ligados = new Set(p.jogadores || []);
    return entradas(pid).map(e => {
      const c = acharJogador(e.nome, p, e.clube);
      const ja = c.find(x => ligados.has(x.j.id));
      return { ...e, cands: c, ligado: ja ? ja.j : null, sugestao: !ja && c.length === 1 ? c[0] : null };
    });
  });
  /* Ligações sugeridas no banco inteiro (só nome idêntico e candidato único). */
  const pendencias = () => memo('pend', () => {
    const out = [];
    for (const p of DB.partidas) { if (!DB.obs[p.id]) continue; const s = citados(p.id).filter(c => c.sugestao && c.sugestao.grau === 'certo'); if (s.length) out.push({ p, itens: s }); }
    return out.sort((a, b) => (b.p.data || '').localeCompare(a.p.data || ''));
  });
  /* Trechos de observação sobre um jogador, jogo a jogo (ligados e apenas citados). */
  const trechos = jid => memo('tr:' + jid, () => {
    const j = get('jogadores', jid); if (!j) return [];
    const out = [], vistos = new Set();
    const pega = (p, ligado) => {
      if (vistos.has(p.id)) return; vistos.add(p.id);
      const e = entradas(p.id).find(e => acharJogador(e.nome, p, e.clube).some(c => c.j.id === jid));
      if (ligado || e) out.push({ p, ligado, texto: e ? e.texto : '', num: e ? e.num : null });
    };
    for (const p of partidasDe(jid)) pega(p, true);
    const tn = U.tokens(j.nome); const chave = tn.length ? tn[tn.length - 1] : null;
    if (chave) for (const p of DB.partidas) if (!vistos.has(p.id) && DB.obs[p.id] && U.norm(DB.obs[p.id]).includes(chave)) pega(p, false);
    return out.sort((a, b) => (b.p.data || '').localeCompare(a.p.data || ''));
  });

  /* ---------- campograma ---------- */
  const G = (k, label, pos, x, y) => ({ k, label, pos, x, y });
  const GK = G('gk', 'GOL', 'GOLEIRO', 50, 91);
  const D4 = [G('rb', 'LD', 'LATERAL DIREITO', 86, 71), G('rcb', 'ZAG', 'ZAGUEIRO', 62, 76), G('lcb', 'ZAG', 'ZAGUEIRO', 38, 76), G('lb', 'LE', 'LATERAL ESQUERDO', 14, 71)];
  const D3 = [G('rcb', 'ZAG', 'ZAGUEIRO', 72, 76), G('cb', 'ZAG', 'ZAGUEIRO', 50, 78), G('lcb', 'ZAG', 'ZAGUEIRO', 28, 76)];
  const FORMACOES = {
    '4-3-3': [GK, ...D4, G('dm', 'VOL', 'VOLANTE', 50, 57), G('rcm', 'MÉD', 'MÉDIO', 70, 43), G('lcm', 'MÉD', 'MÉDIO', 30, 43), G('rw', 'EXT', 'EXTREMO', 85, 21), G('st', 'ATA', 'ATACANTE', 50, 13), G('lw', 'EXT', 'EXTREMO', 15, 21)],
    '4-2-3-1': [GK, ...D4, G('rdm', 'VOL', 'VOLANTE', 64, 56), G('ldm', 'VOL', 'VOLANTE', 36, 56), G('rw', 'EXT', 'EXTREMO', 85, 30), G('am', 'MEIA', 'MEIA', 50, 35), G('lw', 'EXT', 'EXTREMO', 15, 30), G('st', 'ATA', 'ATACANTE', 50, 12)],
    '4-4-2': [GK, ...D4, G('rm', 'EXT', 'EXTREMO', 86, 44), G('rcm', 'VOL', 'VOLANTE', 62, 50), G('lcm', 'MÉD', 'MÉDIO', 38, 50), G('lm', 'EXT', 'EXTREMO', 14, 44), G('rst', 'ATA', 'ATACANTE', 62, 15), G('lst', 'ATA', 'ATACANTE', 38, 15)],
    '4-1-4-1': [GK, ...D4, G('dm', 'VOL', 'VOLANTE', 50, 59), G('rm', 'EXT', 'EXTREMO', 86, 36), G('rcm', 'MÉD', 'MÉDIO', 63, 41), G('lcm', 'MEIA', 'MEIA', 37, 41), G('lm', 'EXT', 'EXTREMO', 14, 36), G('st', 'ATA', 'ATACANTE', 50, 12)],
    '3-5-2': [GK, ...D3, G('rwb', 'ALA D', 'LATERAL DIREITO', 88, 48), G('dm', 'VOL', 'VOLANTE', 50, 58), G('rcm', 'MÉD', 'MÉDIO', 68, 42), G('lcm', 'MEIA', 'MEIA', 32, 42), G('lwb', 'ALA E', 'LATERAL ESQUERDO', 12, 48), G('rst', 'ATA', 'ATACANTE', 62, 15), G('lst', 'ATA', 'ATACANTE', 38, 15)],
    '3-4-3': [GK, ...D3, G('rwb', 'ALA D', 'LATERAL DIREITO', 88, 50), G('rcm', 'VOL', 'VOLANTE', 62, 53), G('lcm', 'MÉD', 'MÉDIO', 38, 53), G('lwb', 'ALA E', 'LATERAL ESQUERDO', 12, 50), G('rw', 'EXT', 'EXTREMO', 80, 22), G('st', 'ATA', 'ATACANTE', 50, 13), G('lw', 'EXT', 'EXTREMO', 20, 22)],
    '5-3-2': [GK, G('rwb', 'ALA D', 'LATERAL DIREITO', 90, 64), ...D3, G('lwb', 'ALA E', 'LATERAL ESQUERDO', 10, 64), G('dm', 'VOL', 'VOLANTE', 50, 55), G('rcm', 'MÉD', 'MÉDIO', 70, 42), G('lcm', 'MEIA', 'MEIA', 30, 42), G('rst', 'ATA', 'ATACANTE', 62, 15), G('lst', 'ATA', 'ATACANTE', 38, 15)],
  };

  return {
    CAMPOS, opcoes, nomeClube, nomeJog, clubesDe, titulo, tituloCurto, rotulo, partidasDe, partidasDoClube, jogadoresDoClube, agentesDe, ultimaVez, diasSemVer,
    faltando, paraRever, followUps, nomeLado, clubesSoltos, sugerirClubes, entradas, acharJogador, citados, pendencias, trechos, FORMACOES,
  };
})();

</script>
<script>
/* Telas do app. */
(() => {
  const { DB } = Store, { esc, chip } = U;
  const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const ST = { sec: null, sort: {}, filt: {}, modo: { jogadores: 'tabela', partidas: 'tabela' }, cal: U.today().slice(0, 7), cmp: [], pilha: [], tudo: {}, editando: {} };
  const view = $('#view'), drawer = $('#drawer'), modal = $('#modal');
  const SING = { jogadores: 'jogador', partidas: 'partida', clubes: 'clube', contatos: 'contato' };

  const toast = (msg, ms = 2600) => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms); };
  const vazio = v => v == null || v === '' || (Array.isArray(v) && !v.length);
  const chips = v => [].concat(v ?? []).map(x => chip(x)).join('');
  const relChip = (ent, id) => { const r = Store.get(ent, id); return r ? `<a class="chip rel" data-act="abrir" data-ent="${ent}" data-id="${id}">${esc(M.rotulo(ent, r))}</a>` : ''; };
  const haDias = d => d == null ? '<span class="mut">nunca visto</span>' : d === 0 ? 'hoje' : `há ${d} dia${d > 1 ? 's' : ''}`;
  const statusDot = j => j.status ? `<span class="dot" style="--h:${U.hue(j.status)}" title="${esc(j.status)}"></span>` : '';
  const subJog = j => [(j.posicoes || []).join(' / '), j.nascimento ? U.age(j.nascimento) + ' anos' : '', M.clubesDe(j).join(' / ')].filter(Boolean).join(' · ');

  /* ================= LISTAS (tabelas) ================= */
  const LISTAS = {
    jogadores: {
      titulo: 'Jogadores', ordem: { i: 1, dir: 1 },
      busca: r => U.norm([r.nome, r.nomeCompleto, ...M.clubesDe(r), r.nacionalidade, r.perfil].join(' ')),
      filtros: [['posicoes', 'Posição'], ['status', 'Status'], ['categorias', 'Categoria'], ['nacionalidade', 'Nacionalidade']],
      flags: [['incompletas', 'Fichas incompletas', r => M.faltando(r).length > 0], ['rever', 'Para rever', r => M.paraRever().some(x => x.j === r)]],
      cols: [
        { l: '', html: r => `<input type="checkbox" data-act="cmp" data-id="${r.id}" ${ST.cmp.includes(r.id) ? 'checked' : ''} title="Selecionar para comparar">`, w: 28 },
        { l: 'Nome', get: r => U.norm(r.nome), html: r => `<b>${esc(r.nome)}</b>` },
        { l: 'Posição', get: r => (r.posicoes || []).join(), html: r => chips(r.posicoes) },
        { l: 'Idade', get: r => U.age(r.nascimento) ?? -1, html: r => U.age(r.nascimento) ?? '' },
        { l: 'Clube atual', get: r => M.clubesDe(r).join(), html: r => M.clubesDe(r).map(n => chip(n)).join('') },
        { l: 'Categoria', get: r => (r.categorias || []).join(), html: r => chips(r.categorias) },
        { l: 'Status', get: r => r.status || '', html: r => chip(r.status) },
        { l: 'Nacionalidade', get: r => r.nacionalidade || '', html: r => chip(r.nacionalidade) },
        { l: 'Pé', get: r => r.pe || '', html: r => esc(r.pe || '') },
        { l: 'Partidas', get: r => M.partidasDe(r.id).length, html: r => M.partidasDe(r.id).length || '' },
        { l: 'Última vez visto', get: r => M.ultimaVez(r.id) || '', html: r => { const d = M.ultimaVez(r.id); return d ? `${U.fmtDate(d)} <span class="mut">· ${haDias(M.diasSemVer(r.id))}</span>` : ''; } },
        { l: 'Falta preencher', get: r => M.faltando(r).length, html: r => `<span class="mut">${esc(M.faltando(r).join(', '))}</span>` },
      ],
    },
    partidas: {
      titulo: 'Partidas', ordem: { i: 0, dir: -1 },
      busca: r => U.norm([M.titulo(r), U.fmtDate(r.data), r.categoria].join(' ')),
      filtros: [['ano', 'Ano'], ['competicao', 'Competição'], ['categoria', 'Categoria'], ['formato', 'Formato']],
      flags: [['semJog', 'Sem jogadores ligados', r => !(r.jogadores || []).length], ['semObs', 'Sem observação', r => !DB.obs[r.id]], ['txt', 'Clube só em texto', r => !!(r.mandanteNome || r.adversarioNome)]],
      cols: [
        { l: 'Data', get: r => r.data || '', html: r => U.fmtDate(r.data), w: 92 },
        { l: 'Título do jogo', get: r => U.norm(M.titulo(r)), html: r => `<b>${esc(M.tituloCurto(r))}</b>` },
        { l: 'Competição', get: r => r.competicao || '', html: r => chip(r.competicao) + (r.rodada ? ` <span class="mut">R${esc(r.rodada)}</span>` : '') },
        { l: 'Categoria', get: r => r.categoria || '', html: r => chip(r.categoria) },
        { l: 'Formato', get: r => r.formato || '', html: r => chip(r.formato) },

  const POS_OGOL = [[/goleir/, 'GOLEIRO'], [/lateral direit|ala direit/, 'LATERAL DIREITO'], [/lateral esquerd|ala esquerd/, 'LATERAL ESQUERDO'], [/zagueir|defesa central|defensor/, 'ZAGUEIRO'],
    [/volante|medio defensivo|meio-campista defensivo/, 'VOLANTE'], [/meia|medio ofensivo|meio ofensivo|armador|medio centro ofensivo/, 'MEIA'], [/medio|meio-campo|meio campo|centrocampista|meio-campista/, 'MÉDIO'],
    [/ponta|extremo/, 'EXTREMO'], [/centroavante|atacante|avancado|ponta de lanca|segundo avancado/, 'ATACANTE']];
  function lerOgol(arg) {
    let d; try { d = JSON.parse(decodeURIComponent(arg)); } catch { return null; }
    const R = d.r || {}, v = k => (R[k] || [])[0] || '';
    const num = s => (String(s || '').match(/\d+/) || [''])[0];
    const pos = [...new Set((R['posição'] || R['posicao'] || []).map(p => { const n = U.norm(p); const m = POS_OGOL.find(([re]) => re.test(n)); return m ? m[1] : null; }).filter(Boolean))];

    const nasc = (d.b || v('data de nascimento')).match(/\d{4}-\d{2}-\d{2}/);
    const contr = v('contrato').match(/(\d{4})\/(\d{2})/);
    return {
      ogol: d.u, nome: d.n, nomeCompleto: v('nome') || null, nascimento: nasc ? nasc[0] : null,
      nacionalidade: (d.nat || v('nacionalidade') || '').toUpperCase() || null, posicoes: pos.length ? pos : null, pe,
      alturaCm: num(d.h || ap[0]) || null, pesoKg: num(d.w || ap[1]) || null, contrato: contr ? `${contr[2]}/${contr[1]}` : null,
      clube: v('clube atual') || null, foto: d.f || null,
    };
  }
  function candidatosOgol(o) {
    const id = (o.ogol || '').split('/').pop(), tk = s => U.tokens(s).join(' ');
    const porLink = DB.jogadores.filter(j => j.ogol && j.ogol.split('/').pop() === id);
    if (porLink.length) return porLink;
    const nomes = [tk(o.nome), tk(o.nomeCompleto)].filter(Boolean), cheio = new Set(U.tokens(o.nomeCompleto || o.nome));
    return DB.jogadores.map(j => {
      const jn = U.tokens(j.nome); let s = 0;
      if (nomes.includes(tk(j.nome)) || (j.nomeCompleto && nomes.includes(tk(j.nomeCompleto)))) s = 3;
      else if (jn.length >= 2 && jn.every(t => cheio.has(t))) s = 2;
      if (s && j.nascimento && o.nascimento) s = j.nascimento === o.nascimento ? s + 2 : 0;
      return { j, s };
    }).filter(x => x.s).sort((a, b) => b.s - a.s).slice(0, 5).map(x => x.j);
  }
  const clubeOgol = nome => { if (!nome) return null; const n = U.norm(nome); return DB.clubes.find(c => U.norm(c.nome) === n) || (M.sugerirClubes(nome)[0] || {}).c || null; };

  function ogolSalvar() {
    const o = ST.ogolDados; if (!o) return;
    const marc = new Set($$('[data-og]').filter(c => c.checked).map(c => c.dataset.og));

    novoSolto: el => ligaSolto(el.dataset.nome, Store.add('clubes', { nome: el.dataset.nome.toUpperCase() }).id),
    cmpTira: el => { ST.cmp = ST.cmp.filter(x => x !== el.dataset.id); pintar(); }, cmpLimpa: () => { ST.cmp = []; pintar(); },
    proxIncompleta: () => { const l = linhas('jogadores').filter(j => M.faltando(j).length), a = atual(), i = l.findIndex(j => j.id === a.id), n = l[(i + 1) % l.length]; if (!n || n.id === a.id) return toast('Não há outra ficha incompleta nesta lista.'); ST.pilha = []; abrir('jogadores', n.id); },
    importar: importarModal, importarOk, fechaModal,
    novoCampo: () => { const g = Store.add('campogramas', { nome: 'Novo campograma', formacao: '4-3-3', slots: {} }); location.hash = '#/campograma/' + g.id; },
    dupCampo: () => { const g = campoAtual(), n = Store.add('campogramas', { nome: (g.nome || '') + ' (cópia)', formacao: g.formacao, slots: JSON.parse(JSON.stringify(g.slots || {})), notas: g.notas }); location.hash = '#/campograma/' + n.id; },
    apagaCampo: async () => { const g = campoAtual(); if (!await pergunta(`Apagar o campograma "${g.nome}"?`, 'Apagar')) return; Store.remove('campogramas', g.id); location.hash = '#/campogramas'; },
    imprimir: () => window.print(),
    slotAdd: el => slotModal(el.dataset.slot), slotEscolhe: el => addSlot(el.dataset.slot, el.dataset.id),
    fichaMenu: el => fichaMenu(el.dataset.id, el.dataset.slot),
    fmAbrir: el => { fechaModal(); abrir('jogadores', el.dataset.id); },
    fmOrdem: el => { const g = campoAtual(), l = g.slots[el.dataset.slot], i = l.indexOf(el.dataset.id), n = i + +el.dataset.d;[l[i], l[n]] = [l[n], l[i]]; salvaCampo(g); fechaModal(); pintar(true); },
    fmTira: el => { fechaModal(); moveSlot(el.dataset.id, el.dataset.slot, null); },
    editNort: () => { ST.editNort = !ST.editNort; pintar(true); },
    recarregar: async () => { await Store.flush(); await Store.cacheClear(); location.reload(); },
    backup: () => U.download(`scout-dados-${U.today()}.json`, JSON.stringify(Store.pacote()), 'application/json'),
    csv: el => { const e = el.dataset.ent; U.download(`${e}-${U.today()}.csv`, '﻿' + U.csv(DB[e], [...M.CAMPOS[e].map(c => ({ label: c.l, get: r => valorCSV(e, r, c) })), ...(e === 'partidas' ? [{ label: 'Observação da partida', get: r => DB.obs[r.id] || '' }] : [])]), 'text/csv'); },
    tema: () => { const t = document.documentElement.dataset.tema === 'claro' ? 'escuro' : 'claro'; document.documentElement.dataset.tema = t; localStorage.setItem('scout_tema', t); },
    sair: async () => { if (!await pergunta('Desconectar este aparelho? Os dados continuam salvos no GitHub.', 'Desconectar')) return; await Store.flush(); localStorage.removeItem('scout_cfg'); await Store.cacheClear(); location.reload(); },
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!e.target.closest('.busca')) $('#qres').hidden = true;
    if (!e.target.closest('.pick')) $$('.pick .pop').forEach(p => p.hidden = true);
    if (e.target.id === 'veu') return fechar();
    if (e.target === modal) return fechaModal();
    if (!el) return;
    if (el.tagName === 'INPUT' && el.type === 'checkbox') { e.stopPropagation(); return ACOES[el.dataset.act](el, e); }
    if (el.tagName === 'TR' && e.target.closest('input,button,a,select')) return;
    const f = ACOES[el.dataset.act]; if (f) { if (el.tagName === 'A' && !el.getAttribute('href')) e.preventDefault(); f(el, e); }
  });
  document.addEventListener('change', async e => {
    const t = e.target, a = atual();
    if (t.dataset.f != null && a && drawer.contains(t)) {
      const k = t.dataset.f; let v = t.value.trim ? t.value.trim() : t.value;
      if (v === '__novo') { v = await novaOpcao(a.ent, k); if (!v) { refazCampo(k); return; } }
      gravar(k, v); const c = M.CAMPOS[a.ent].find(c => c.k === k);
      if (c.t === 'md') { ST.editando[k] = false; refazCampo(k); } else if (c.t === 'url' || t.tagName === 'SELECT') refazCampo(k);
      refazExtras(); return;
    }
    if (t.dataset.add && a) { const k = t.dataset.add; let v = t.value; if (v === '__novo') v = await novaOpcao(a.ent, k); if (v) { const r = Store.get(a.ent, a.id); if (!(r[k] || []).includes(v)) gravar(k, [...(r[k] || []), v]); } refazCampo(k); refazExtras(); return; }
    if (t.dataset.obs != null && a) {
      Store.setObs(a.id, t.value.trim()); Store.set('partidas', a.id, {}); ST.editando.obs = false; ST.sujo = true;
      const dt = U.parseHeader(t.value).data, p = Store.get('partidas', a.id);   // a data escrita no texto manda
      if (dt && p && dt !== p.data) { Store.set('partidas', a.id, { data: dt }); Store.reObs(a.id); refazCampo('data'); toast(`Data ajustada para ${U.fmtDate(dt)}, como está no texto.`); }
      refazExtras(); return;
    }
    if (t.dataset.ff) { filtro(ST.sec).f[t.dataset.ff] = t.value; corpo(); return; }
    if (t.dataset.fl) { filtro(ST.sec).flags[t.dataset.fl] = t.checked; corpo(); return; }
    if (t.dataset.cg) { const g = campoAtual(), k = t.dataset.cg; if (k === 'formacao') { const novas = M.FORMACOES[t.value], ant = M.FORMACOES[g.formacao] || [], ns = {};
        for (const s of ant) for (const id of (g.slots || {})[s.k] || []) { const alvo = novas.find(n => n.k === s.k) || novas.find(n => n.pos === s.pos && !(ns[n.k] || []).length) || novas.find(n => n.pos === s.pos); (ns[alvo ? alvo.k : '_x_' + s.k] = ns[alvo ? alvo.k : '_x_' + s.k] || []).push(id); }
        for (const k2 in g.slots || {}) if (!ant.some(s => s.k === k2)) ns[k2] = [...(ns[k2] || []), ...g.slots[k2]];
        g.slots = ns; g.formacao = t.value; salvaCampo(g); pintar(true); } else { g[k] = t.value; salvaCampo(g); } return; }
    if (t.dataset.fmmove != null && t.value) { fechaModal(); moveSlot(t.dataset.id, t.dataset.slot, t.value); return; }
    if (t.name === 'ogolAlvo') { ST.ogolAlvo = t.value; pintar(true); return; }
    if (t.dataset.lemb) { const L = { ...(DB.config.lembretes || {}) }; if (t.value) L[t.dataset.lemb] = +t.value; else delete L[t.dataset.lemb]; Store.setConfig({ lembretes: L }); return; }
    if (t.dataset.nort != null) { Store.setNorteador(t.value); return; }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'q') return buscaGeral(t.value);
    if (t.dataset.fq != null) { filtro(ST.sec).q = t.value; return corpo(); }
    if (t.dataset.pick) return sugerir(t);
    if (t.id === 'imp') return previaImport();
    if (t.tagName === 'TEXTAREA') { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, innerHeight * 0.7) + 'px'; }
  });
  document.addEventListener('focusin', e => { const t = e.target; if (t.tagName === 'TEXTAREA') { t.style.height = Math.min(t.scrollHeight + 2, innerHeight * 0.7) + 'px'; } if (t.id === 'q' && t.value) buscaGeral(t.value); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!modal.hidden) fechaModal(); else if (!$('#qres').hidden) $('#qres').hidden = true; else if (atual()) fechar(); }
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.pick) { const p = e.target.nextElementSibling, a = $('a', p); if (a && !p.hidden) { e.preventDefault(); escolher(a); } }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('.campos input.in')) e.target.blur();
  });
  // arrastar: quadro de status e campograma
  let arr = null;
  document.addEventListener('dragstart', e => { const el = e.target.closest && e.target.closest('[data-drag]'); if (!el) return; arr = { tipo: el.dataset.drag, id: el.dataset.id, slot: el.dataset.slot }; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', el.dataset.id); });
  document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z && arr) { e.preventDefault(); z.classList.add('sobre'); } });
  document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('sobre'); });
  document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z || !arr) return; e.preventDefault(); z.classList.remove('sobre');
    if (z.dataset.drop === 'status' && arr.tipo === 'jog') { Store.set('jogadores', arr.id, { status: z.dataset.v }); corpo(); }
    if (z.dataset.drop === 'slot' && arr.tipo === 'slot' && z.dataset.slot !== '_fora') { const sobre = e.target.closest('.ficha'); moveSlot(arr.id, arr.slot, z.dataset.slot, sobre && sobre.dataset.id !== arr.id ? sobre.dataset.id : null); }
    arr = null; });
  document.addEventListener('dragend', () => { arr = null; $$('.sobre').forEach(x => x.classList.remove('sobre')); });

  window.addEventListener('hashchange', () => { if (atual()) { ST.pilha = []; drawer.hidden = true; $('#veu').hidden = true; } pintar(); });
  window.addEventListener('beforeunload', e => { if (Store.pendente) { Store.flush(); e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', async () => { if (document.hidden) Store.flush(); else if (await Store.refresh()) { pintar(true); if (atual()) gaveta(); toast('Dados atualizados com o que foi salvo em outro aparelho.'); } });
  Store.onStatus((s, err) => { const el = $('#status'); if (Store.backend && !Store.backend.remoto) { el.className = 'status'; el.textContent = 'Teste — não salva'; if (s === 'ok' && ST.sujo && !atual()) repintar(); return; } el.className = 'status ' + s; el.textContent = { ok: 'Salvo', pendente: 'Alterado…', salvando: 'Salvando…', erro: 'Não salvou — tentando de novo' }[s]; el.title = err || ''; if (s === 'ok' && ST.sujo && !atual()) repintar(); });

  /* ================= ENTRADA ================= */
  const lerArquivo = input => new Promise((res, rej) => { const f = input.files[0]; if (!f) return rej(new Error('Nenhum arquivo escolhido.')); const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(f); });
  function telaSetup(erro, tentativa) {
    const s = $('#setup'), cfg = tentativa || JSON.parse(localStorage.getItem('scout_cfg') || '{}');
    s.hidden = false; $('#app').hidden = true;
    s.innerHTML = `<form class="mcx" id="fsetup"><div class="brand"><span class="logo"></span><b>Scouting</b></div><h2>Conectar aos seus dados</h2>
      <p class="mut">Os dados ficam no seu repositório privado do GitHub. A chave fica guardada só neste navegador.</p>${erro ? `<p class="alerta">${esc(erro)}</p>` : ''}
      <label>Usuário do GitHub</label><input class="in" name="user" required value="${esc(cfg.user || '')}" autocomplete="username" autocapitalize="off">
      <label>Repositório dos dados</label><input class="in" name="repo" required value="${esc(cfg.repo || 'scout-dados')}" autocapitalize="off">
      <label>Chave de acesso (token)</label><input class="in" name="token" type="password" required placeholder="github_pat_…" autocomplete="current-password">
      <button class="btn pri" type="submit">Conectar</button>
      <p class="mut centro">ou <a class="ok" id="testar">só testar com o arquivo de dados</a> (nada é salvo)</p><input type="file" id="ftestar" accept=".json,application/json" hidden></form>`;
    $('#fsetup').onsubmit = e => { e.preventDefault(); const f = new FormData(e.target); const c = { user: f.get('user').trim(), repo: f.get('repo').trim(), token: f.get('token').trim() }; conectar(c); };
    $('#testar').onclick = () => $('#ftestar').click();
    $('#ftestar').onchange = async e => { try { iniciar({ pacote: Store.lerPacote(await lerArquivo(e.target)) }); } catch (err) { telaSetup(err.message); } };
  }
  // Confere o repositório; se estiver vazio, pede o arquivo de dados e envia.
  async function conectar(c) {
    const s = $('#setup'); s.innerHTML = `<div class="mcx centro"><div class="brand"><span class="logo"></span><b>Scouting</b></div><p class="mut">Conferindo o repositório…</p></div>`;
    let remote;
    try { remote = await Store.listar(c); }
    catch (e) { return telaSetup(e.status === 401 ? 'A chave de acesso não foi aceita. Confira se copiou inteira e se ainda está válida.' : e.status === 404 ? 'Não achei esse repositório. Confira o usuário, o nome do repositório e se a chave dá acesso a ele.' : 'Não consegui conectar: ' + e.message, c); }
    localStorage.setItem('scout_cfg', JSON.stringify(c));
    if (!Store.arquivosVazios(remote)) return iniciar(c);
    s.innerHTML = `<div class="mcx"><div class="brand"><span class="logo"></span><b>Scouting</b></div><h2>Repositório conectado, mas ainda vazio</h2>
      <p class="mut">Escolha o arquivo <b>scout-dados.json</b> (os seus dados migrados do Coda) para enviar ao repositório. Isso só precisa ser feito uma vez.</p>
      <input type="file" id="fenviar" accept=".json,application/json" class="in"><p id="penviar" class="mut"></p></div>`;
    $('#fenviar').onchange = async e => {
      try {
        const arq = Store.lerPacote(await lerArquivo(e.target)); e.target.disabled = true;
        await Store.enviarPacote(c, arq, (a, b) => $('#penviar').textContent = `Enviando… ${a} de ${b} arquivos`);
        iniciar(c);
      } catch (err) { $('#penviar').innerHTML = `<span class="alerta">${esc(err.message)}</span>`; e.target.disabled = false; }
    };
  }
  async function iniciar(cfg) {
    const s = $('#setup'); s.hidden = false; $('#app').hidden = true; s.innerHTML = `<div class="mcx centro"><div class="brand"><span class="logo"></span><b>Scouting</b></div><p id="prog" class="mut">Carregando dados…</p></div>`;
    try {
      const n = await Store.connect(cfg, (a, b) => { const p = $('#prog'); if (p) p.textContent = `Carregando dados… ${a} de ${b}`; });
      if (!n) throw new Error('O repositório está vazio ou sem os arquivos de dados.');
    } catch (e) {
      if (cfg.local || cfg.pacote) return telaSetup('Não consegui abrir os dados de teste: ' + e.message);
      return telaSetup(e.status === 401 ? 'A chave de acesso não foi aceita. Confira se copiou inteira e se ainda está válida.' : e.status === 404 ? 'Não achei esse repositório. Confira o usuário, o nome e se a chave tem acesso a ele.' : 'Não consegui carregar: ' + e.message);
    }
    s.hidden = true; $('#app').hidden = false; if (!location.hash) location.hash = '#/painel'; pintar();
    if (cfg.local || cfg.pacote) { toast('Modo de teste: as alterações não são salvas.', 5000); $('#status').textContent = 'Teste — não salva'; $('#status').className = 'status'; }
  }
  document.documentElement.dataset.tema = localStorage.getItem('scout_tema') || (matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro');
  const local = new URLSearchParams(location.search).get('local'), salvo = JSON.parse(localStorage.getItem('scout_cfg') || 'null');
  if (local && !/:|^\/\//.test(local)) iniciar({ local: local.endsWith('/') ? local : local + '/' }); else if (salvo && salvo.token) iniciar(salvo); else telaSetup();
  window.__scout = { ST, Store, M, pintar, bookmarklet };
})();

</script>
